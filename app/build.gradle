plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monbureau.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.monbureau.launcher"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Aucune dependance externe : pas d'appcompat, donc pas de conflit kotlin
// et pas de contrainte de theme AppCompat.
dependencies {
}
