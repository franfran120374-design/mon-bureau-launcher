plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monbureau.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.monbureau.launcher"
        minSdk 26
        targetSdk 34
        // versionCode passe de 1 a 2 : sans cela, Android peut refuser
        // d'installer la nouvelle version par-dessus l'ancienne.
        // A INCREMENTER a chaque nouvelle version livree (3, 4, 5...).
        versionCode 2
        versionName "1.1"
    }

    // ------------------------------------------------------------------
    // SIGNATURE PERMANENTE
    // ------------------------------------------------------------------
    // La cle n'est PAS dans le depot : elle arrive par les variables
    // d'environnement remplies par GitHub Actions depuis les "Secrets".
    // Si ces variables sont absentes (compilation locale sans cle), on
    // ne configure rien et Gradle se rabat sur la signature debug, ce
    // qui evite de bloquer une compilation de test.
    // ------------------------------------------------------------------
    signingConfigs {
        release {
            def cheminCle = System.getenv("MB_KEYSTORE_FILE")
            if (cheminCle != null && file(cheminCle).exists()) {
                storeFile file(cheminCle)
                storePassword System.getenv("MB_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MB_KEY_ALIAS")
                keyPassword System.getenv("MB_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def cheminCle = System.getenv("MB_KEYSTORE_FILE")
            if (cheminCle != null && file(cheminCle).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
